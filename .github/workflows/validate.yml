name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run replay
      - run: npm run conformance -- templates/world-pack-starter --json
      - run: npm run conformance -- examples/signal-room --json
      - run: npm pack --dry-run --json
